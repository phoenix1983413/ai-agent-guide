<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066CC"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#F5F7FA" rx="12"/>
  <text x="360" y="36" text-anchor="middle" font-family="Inter, Noto Sans SC, PingFang SC" font-size="18" font-weight="700" fill="#1D1D1F">个人助理场景架构</text>
  
  <!-- 模块 A -->
  <rect x="40" y="60" width="160" height="80" fill="#FFFFFF" stroke="#0066CC" stroke-width="2" rx="10"/>
  <text x="120" y="92" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="13" font-weight="700" fill="#0066CC">输入层</text>
  <text x="120" y="112" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">用户 / 环境 / 系统</text>
  <text x="120" y="128" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#8B5CF6">多模态感知</text>
  
  <!-- 模块 B -->
  <rect x="280" y="60" width="160" height="80" fill="#FFFFFF" stroke="#0066CC" stroke-width="2" rx="10"/>
  <text x="360" y="92" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="13" font-weight="700" fill="#0066CC">处理层</text>
  <text x="360" y="112" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">推理 / 规划 / 决策</text>
  <text x="360" y="128" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#8B5CF6">LLM + 策略引擎</text>
  
  <!-- 模块 C -->
  <rect x="520" y="60" width="160" height="80" fill="#FFFFFF" stroke="#0066CC" stroke-width="2" rx="10"/>
  <text x="600" y="92" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="13" font-weight="700" fill="#0066CC">输出层</text>
  <text x="600" y="112" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">行动 / 响应 / 反馈</text>
  <text x="600" y="128" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#8B5CF6">工具调用 / 生成内容</text>
  
  <!-- 箭头 -->
  <line x1="200" y1="100" x2="280" y2="100" stroke="#0066CC" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="100" x2="520" y2="100" stroke="#0066CC" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 反馈回路 -->
  <path d="M 600 140 L 600 200 L 120 200 L 120 140" fill="none" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="360" y="196" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#E74C3C">反馈回路：结果观察 → 策略调整 → 持续优化</text>
  
  <!-- 关键特性 -->
  <rect x="40" y="230" width="640" height="60" fill="#E8F4FD" stroke="#0066CC" stroke-width="1.5" rx="10"/>
  <text x="360" y="256" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="13" font-weight="700" fill="#0066CC">关键工程考量</text>
  <text x="360" y="276" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="12" fill="#4A5568">模块化解耦 · 接口标准化 · 异步通信 · 容错降级 · 可观测性 · 安全边界</text>
</svg>