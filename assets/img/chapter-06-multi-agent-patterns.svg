<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066CC"/>
    </marker>
  </defs>
  <rect width="720" height="480" fill="#F5F7FA" rx="12"/>
  
  <text x="360" y="32" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="18" font-weight="700" fill="#1D1D1F">多 Agent 协作架构对比</text>
  
  <!-- Pattern 1: Orchestrator -->
  <rect x="40" y="60" width="200" height="160" fill="#FFFFFF" stroke="#0066CC" stroke-width="2" rx="10"/>
  <text x="140" y="86" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="14" font-weight="700" fill="#0066CC">Orchestrator 集中编排</text>
  <rect x="60" y="100" width="160" height="50" fill="#E8F4FD" stroke="#0066CC" stroke-width="1" rx="6"/>
  <text x="140" y="122" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="12" font-weight="700" fill="#0066CC">Orchestrator</text>
  <text x="140" y="138" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">任务分解 + 路由 + 汇总</text>
  
  <rect x="60" y="160" width="70" height="40" fill="#F5F7FA" stroke="#8B5CF6" stroke-width="1" rx="6"/>
  <text x="95" y="176" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" font-weight="700" fill="#8B5CF6">Worker A</text>
  <text x="95" y="190" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="10" fill="#4A5568">分析</text>
  
  <rect x="145" y="160" width="70" height="40" fill="#F5F7FA" stroke="#8B5CF6" stroke-width="1" rx="6"/>
  <text x="180" y="176" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" font-weight="700" fill="#8B5CF6">Worker B</text>
  <text x="180" y="190" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="10" fill="#4A5568">执行</text>
  
  <line x1="140" y1="150" x2="95" y2="160" stroke="#0066CC" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="140" y1="150" x2="180" y2="160" stroke="#0066CC" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="95" y1="200" x2="140" y2="210" stroke="#8B5CF6" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="180" y1="200" x2="140" y2="210" stroke="#8B5CF6" stroke-width="1" marker-end="url(#arrow)"/>
  
  <text x="140" y="230" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#718096">适合：强控制、复杂任务</text>
  
  <!-- Pattern 2: Pipeline -->
  <rect x="260" y="60" width="200" height="160" fill="#FFFFFF" stroke="#0066CC" stroke-width="2" rx="10"/>
  <text x="360" y="86" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="14" font-weight="700" fill="#0066CC">Pipeline 顺序管道</text>
  <rect x="280" y="100" width="160" height="36" fill="#E8F4FD" stroke="#0066CC" stroke-width="1" rx="6"/>
  <text x="360" y="118" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="12" font-weight="700" fill="#0066CC">Agent A</text>
  <text x="360" y="132" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="10" fill="#4A5568">意图识别</text>
  <line x1="360" y1="136" x2="360" y2="155" stroke="#0066CC" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <rect x="280" y="155" width="160" height="36" fill="#E8F4FD" stroke="#0066CC" stroke-width="1" rx="6"/>
  <text x="360" y="173" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="12" font-weight="700" fill="#0066CC">Agent B</text>
  <text x="360" y="187" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="10" fill="#4A5568">数据检索</text>
  <line x1="360" y1="191" x2="360" y2="210" stroke="#0066CC" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <rect x="280" y="210" width="160" height="36" fill="#E8F4FD" stroke="#0066CC" stroke-width="1" rx="6"/>
  <text x="360" y="228" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="12" font-weight="700" fill="#0066CC">Agent C</text>
  <text x="360" y="242" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="10" fill="#4A5568">结果生成</text>
  
  <text x="360" y="272" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#718096">适合：线性工作流</text>
  
  <!-- Pattern 3: Debate -->
  <rect x="480" y="60" width="200" height="160" fill="#FFFFFF" stroke="#0066CC" stroke-width="2" rx="10"/>
  <text x="580" y="86" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="14" font-weight="700" fill="#0066CC">Debate 辩论协作</text>
  <rect x="500" y="100" width="70" height="50" fill="#E8F4FD" stroke="#8B5CF6" stroke-width="1" rx="6"/>
  <text x="535" y="122" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="12" font-weight="700" fill="#8B5CF6">Generator</text>
  <text x="535" y="138" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="10" fill="#4A5568">生成方案</text>
  
  <rect x="590" y="100" width="70" height="50" fill="#E8F4FD" stroke="#8B5CF6" stroke-width="1" rx="6"/>
  <text x="625" y="122" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="12" font-weight="700" fill="#8B5CF6">Reviewer</text>
  <text x="625" y="138" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="10" fill="#4A5568">审查优化</text>
  
  <line x1="570" y1="125" x2="590" y2="125" stroke="#0066CC" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="625" y1="150" x2="535" y2="150" stroke="#0066CC" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="535" y1="150" x2="535" y2="160" stroke="#0066CC" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="535" y1="160" x2="580" y2="170" stroke="#0066CC" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="560" y="170" width="70" height="36" fill="#0066CC" rx="6"/>
  <text x="595" y="191" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" font-weight="700" fill="#FFFFFF">Decision</text>
  
  <text x="580" y="232" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#718096">适合：方案评审 / 安全审核</text>
  
  <!-- Communication Protocol -->
  <text x="360" y="300" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="14" font-weight="700" fill="#1D1D1F">通信协议核心字段</text>
  
  <rect x="40" y="310" width="640" height="130" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" rx="10"/>
  
  <text x="80" y="336" font-family="Inter, Noto Sans SC" font-size="12" font-weight="700" fill="#0066CC">消息结构</text>
  <text x="80" y="356" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">id: 消息唯一 ID (UUID)</text>
  <text x="80" y="374" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">from / to: 发送方 / 接收方 Agent ID</text>
  <text x="80" y="392" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">type: request / response / event / error</text>
  <text x="80" y="410" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">payload: 业务数据</text>
  
  <text x="400" y="336" font-family="Inter, Noto Sans SC" font-size="12" font-weight="700" fill="#0066CC">通信方式</text>
  <text x="400" y="356" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">同步 RPC：短链路、低延迟</text>
  <text x="400" y="374" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">异步消息队列：长任务、解耦</text>
  <text x="400" y="392" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">事件总线：广播、日志</text>
  <text x="400" y="410" font-family="Inter, Noto Sans SC" font-size="11" fill="#E74C3C">生产环境优先用消息队列</text>
</svg>
