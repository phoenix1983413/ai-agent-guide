<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066CC"/>
    </marker>
  </defs>
  <rect width="720" height="440" fill="#F5F7FA" rx="12"/>
  
  <text x="360" y="32" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="18" font-weight="700" fill="#1D1D1F">ReAct 框架：Thought → Action → Observation 闭环</text>
  
  <!-- Central LLM Brain -->
  <ellipse cx="360" cy="200" rx="90" ry="50" fill="#E8F4FD" stroke="#0066CC" stroke-width="2.5"/>
  <text x="360" y="196" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="14" font-weight="700" fill="#0066CC">LLM 大脑</text>
  <text x="360" y="214" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="12" fill="#4A5568">推理 + 决策</text>
  
  <!-- Thought -->
  <rect x="80" y="130" width="140" height="60" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2" rx="10"/>
  <text x="150" y="156" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="13" font-weight="700" fill="#8B5CF6">Thought</text>
  <text x="150" y="176" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">推理思考</text>
  <line x1="220" y1="160" x2="270" y2="180" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Action -->
  <rect x="500" y="130" width="140" height="60" fill="#FFFFFF" stroke="#34C759" stroke-width="2" rx="10"/>
  <text x="570" y="156" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="13" font-weight="700" fill="#34C759">Action</text>
  <text x="570" y="176" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">执行工具</text>
  <line x1="450" y1="180" x2="500" y2="160" stroke="#34C759" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Observation -->
  <rect x="500" y="250" width="140" height="60" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" rx="10"/>
  <text x="570" y="276" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="13" font-weight="700" fill="#F59E0B">Observation</text>
  <text x="570" y="296" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">观察结果</text>
  <line x1="450" y1="220" x2="500" y2="280" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- User Input -->
  <rect x="80" y="250" width="140" height="60" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="10"/>
  <text x="150" y="276" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="13" font-weight="700" fill="#E74C3C">用户输入</text>
  <text x="150" y="296" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">目标 / 问题</text>
  <line x1="150" y1="250" x2="150" y2="220" stroke="#E74C3C" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Loop back arrows -->
  <line x1="360" y1="150" x2="360" y2="130" stroke="#0066CC" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="380" y="142" font-family="Inter, Noto Sans SC" font-size="11" fill="#0066CC">生成 Thought</text>
  
  <line x1="570" y1="190" x2="570" y2="250" stroke="#34C759" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="590" y="222" font-family="Inter, Noto Sans SC" font-size="11" fill="#34C759">执行 Action</text>
  
  <line x1="500" y1="280" x2="270" y2="220" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="360" y="266" font-family="Inter, Noto Sans SC" font-size="11" fill="#F59E0B">Observation 回填</text>
  
  <!-- Final answer -->
  <rect x="280" y="360" width="160" height="50" fill="#0066CC" rx="10"/>
  <text x="360" y="382" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="13" font-weight="700" fill="#FFFFFF">Final Answer</text>
  <text x="360" y="400" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#FFFFFF">任务完成，输出答案</text>
  <line x1="360" y1="310" x2="360" y2="360" stroke="#0066CC" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Legend -->
  <text x="40" y="440" font-family="Inter, Noto Sans SC" font-size="11" fill="#718096">循环终止条件：信息充足 / 达到最大轮次 / 工具持续报错 / 用户干预</text>
</svg>
