<svg width="720" height="480" viewBox="0 0 720 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066CC"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0066CC" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="480" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1D1D1F">Agent 感知-决策-行动-反思闭环</text>
  <text x="360" y="56" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#718096">ReAct Loop：自主智能的核心引擎</text>

  <!-- Central Hub -->
  <circle cx="360" cy="240" r="55" fill="#0066CC" filter="url(#shadow)"/>
  <text x="360" y="235" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Agent</text>
  <text x="360" y="252" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#E2E8F0">核心循环</text>

  <!-- Node 1: 感知 (Top) -->
  <rect x="290" y="70" width="140" height="56" rx="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="98" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1D1D1F">感知</text>
  <text x="360" y="114" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#718096">Perceive</text>
  <text x="360" y="128" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" fill="#94A3B8">用户消息 · 系统状态</text>

  <!-- Node 2: 决策 (Right) -->
  <rect x="490" y="190" width="140" height="56" rx="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="218" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1D1D1F">决策</text>
  <text x="560" y="234" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#718096">Decide</text>
  <text x="560" y="248" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" fill="#94A3B8">LLM 推理 · 规划</text>

  <!-- Node 3: 行动 (Bottom) -->
  <rect x="290" y="354" width="140" height="56" rx="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="382" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1D1D1F">行动</text>
  <text x="360" y="398" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#718096">Act</text>
  <text x="360" y="412" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" fill="#94A3B8">工具调用 · 写入 · 发送</text>

  <!-- Node 4: 反思 (Left) -->
  <rect x="90" y="190" width="140" height="56" rx="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="218" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1D1D1F">反思</text>
  <text x="160" y="234" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#718096">Reflect</text>
  <text x="160" y="248" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" fill="#94A3B8">观察结果 · 调整策略</text>

  <!-- Arrows forming the cycle -->
  <!-- 感知 -> 决策 -->
  <path d="M 431 98 L 490 218" stroke="#0066CC" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="460" y="155" font-family="Inter, -apple-system, sans-serif" font-size="10" fill="#0066CC">输入</text>

  <!-- 决策 -> 行动 -->
  <path d="M 560 246 L 360 354" stroke="#0066CC" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="485" y="310" font-family="Inter, -apple-system, sans-serif" font-size="10" fill="#0066CC">执行</text>

  <!-- 行动 -> 反思 -->
  <path d="M 289 382 L 160 246" stroke="#0066CC" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="215" y="330" font-family="Inter, -apple-system, sans-serif" font-size="10" fill="#0066CC">结果</text>

  <!-- 反思 -> 感知 -->
  <path d="M 160 218 L 289 98" stroke="#0066CC" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="215" y="155" font-family="Inter, -apple-system, sans-serif" font-size="10" fill="#0066CC">反馈</text>

  <!-- Hub connection lines (dashed) -->
  <line x1="360" y1="185" x2="360" y2="126" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="415" y1="240" x2="490" y2="240" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="360" y1="295" x2="360" y2="354" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="305" y1="240" x2="230" y2="240" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Legend -->
  <rect x="240" y="440" width="240" height="28" rx="6" fill="#F1F5F9"/>
  <text x="360" y="459" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#475569">实线 = 主流程 &nbsp;|&nbsp; 虚线 = 与核心交互</text>
</svg>
