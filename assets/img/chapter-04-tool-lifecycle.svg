<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066CC"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#F5F7FA" rx="12"/>
  
  <text x="360" y="32" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="18" font-weight="700" fill="#1D1D1F">工具调用完整生命周期</text>
  
  <!-- Step 1 -->
  <rect x="40" y="60" width="140" height="70" fill="#FFFFFF" stroke="#0066CC" stroke-width="2" rx="10"/>
  <text x="110" y="86" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="13" font-weight="700" fill="#0066CC">1. 工具声明</text>
  <text x="110" y="106" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">JSON Schema</text>
  <text x="110" y="122" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">定义 name / params</text>
  
  <!-- Step 2 -->
  <rect x="220" y="60" width="140" height="70" fill="#FFFFFF" stroke="#0066CC" stroke-width="2" rx="10"/>
  <text x="290" y="86" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="13" font-weight="700" fill="#0066CC">2. 参数生成</text>
  <text x="290" y="106" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">LLM 输出</text>
  <text x="290" y="122" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">tool_call JSON</text>
  
  <!-- Step 3 -->
  <rect x="400" y="60" width="140" height="70" fill="#FFFFFF" stroke="#0066CC" stroke-width="2" rx="10"/>
  <text x="470" y="86" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="13" font-weight="700" fill="#0066CC">3. 执行</text>
  <text x="470" y="106" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">系统调用</text>
  <text x="470" y="122" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">捕获返回 / 异常</text>
  
  <!-- Step 4 -->
  <rect x="580" y="60" width="100" height="70" fill="#FFFFFF" stroke="#0066CC" stroke-width="2" rx="10"/>
  <text x="630" y="86" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="13" font-weight="700" fill="#0066CC">4. 回填</text>
  <text x="630" y="106" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">role: tool</text>
  <text x="630" y="122" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">写入历史</text>
  
  <!-- Arrows between steps -->
  <line x1="180" y1="95" x2="220" y2="95" stroke="#0066CC" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="95" x2="400" y2="95" stroke="#0066CC" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="95" x2="580" y2="95" stroke="#0066CC" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Continue arrow -->
  <line x1="630" y1="130" x2="630" y2="160" stroke="#0066CC" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="650" y="148" font-family="Inter, Noto Sans SC" font-size="11" fill="#0066CC">继续</text>
  
  <!-- Error handling branch -->
  <rect x="40" y="180" width="300" height="70" fill="#FFEAEA" stroke="#E74C3C" stroke-width="1.5" rx="10"/>
  <text x="190" y="206" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="13" font-weight="700" fill="#E74C3C">异常处理</text>
  <text x="190" y="226" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">超时 / 权限 / 参数错误 / 服务不可用</text>
  <text x="190" y="242" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">策略：重试 / 降级 / 人工介入</text>
  
  <!-- Continue to next step -->
  <rect x="380" y="180" width="300" height="70" fill="#E8F4FD" stroke="#0066CC" stroke-width="1.5" rx="10"/>
  <text x="530" y="206" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="13" font-weight="700" fill="#0066CC">Agent 继续思考</text>
  <text x="530" y="226" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">基于 Observation 决定下一步</text>
  <text x="530" y="242" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">继续调用 / 结束任务 / 向用户求助</text>
  
  <!-- Arrows to branches -->
  <line x1="110" y1="130" x2="110" y2="180" stroke="#E74C3C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="160" x2="630" y2="215" stroke="#0066CC" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Tool types -->
  <text x="360" y="310" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="14" font-weight="700" fill="#1D1D1F">常见工具类型</text>
  
  <rect x="40" y="320" width="120" height="60" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5" rx="8"/>
  <text x="100" y="344" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="12" font-weight="700" fill="#8B5CF6">知识检索</text>
  <text x="100" y="362" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">搜索 / 向量库</text>
  
  <rect x="180" y="320" width="120" height="60" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5" rx="8"/>
  <text x="240" y="344" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="12" font-weight="700" fill="#8B5CF6">代码执行</text>
  <text x="240" y="362" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">Python / Shell</text>
  
  <rect x="320" y="320" width="120" height="60" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5" rx="8"/>
  <text x="380" y="344" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="12" font-weight="700" fill="#8B5CF6">数据操作</text>
  <text x="380" y="362" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">数据库 / API</text>
  
  <rect x="460" y="320" width="120" height="60" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5" rx="8"/>
  <text x="520" y="344" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="12" font-weight="700" fill="#8B5CF6">文件系统</text>
  <text x="520" y="362" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">读写 / 编辑</text>
  
  <rect x="600" y="320" width="80" height="60" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5" rx="8"/>
  <text x="640" y="344" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="12" font-weight="700" fill="#8B5CF6">...</text>
  <text x="640" y="362" text-anchor="middle" font-family="Inter, Noto Sans SC" font-size="11" fill="#4A5568">任意扩展</text>
  
  <!-- Arrow down from continue -->
  <line x1="530" y1="250" x2="530" y2="310" stroke="#0066CC" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
